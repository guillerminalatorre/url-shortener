name: PR Build & Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and run tests with coverage
        run: mvn -B clean verify

      - name: Extract coverage percentage
        id: coverage
        run: |
          report_dir="target/site/jacoco"
          report_file="target/jacoco-report/index.html"

          if [ -f "$report_file" ]; then
            # Extraer porcentaje total (líneas cubiertas)
            coverage=$(grep -Po 'Total.*?(\d+)%' "$report_file" | head -1 | grep -Po '\d+')
          else
            # En caso de que el HTML esté en otra ruta
            coverage=$(grep -Po 'Total.*?(\d+)%' "$report_dir/index.html" | head -1 | grep -Po '\d+')
          fi

          if [ -z "$coverage" ]; then
            echo "No se pudo extraer el porcentaje de cobertura."
            exit 1
          fi

          echo "coverage=$coverage" >> $GITHUB_OUTPUT

      - name: Comentar PR con cobertura
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: "Coverage Report"
          message: |
            🧪 **Cobertura de tests:** `${{ steps.coverage.outputs.coverage }}%`
            > El build fallará automáticamente si la cobertura es menor a 90 % (configurado en JaCoCo).

