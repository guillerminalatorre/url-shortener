name: PR Build & Coverage Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with JaCoCo
        id: build
        run: mvn -B clean verify
        continue-on-error: true

      - name: Find JaCoCo report file
        id: find_report
        run: |
          report_file=$(find . -type f -path "*/target/jacoco-report/jacoco.xml" | head -1 || true)
          if [ -z "$report_file" ]; then
            echo "No se encontró el reporte XML de JaCoCo."
            exit 1
          fi
          echo "report_file=$report_file" >> $GITHUB_OUTPUT

      - name: Extract coverage from XML
        id: coverage
        run: |
          xml="${{ steps.find_report.outputs.report_file }}"
          if [ ! -f "$xml" ]; then
            echo "No se encontró el archivo XML de cobertura."
            exit 1
          fi

          covered=$(xmllint --xpat
