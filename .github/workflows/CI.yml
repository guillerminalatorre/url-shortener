name: PR Build & Coverage Check

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build & test with JaCoCo
        id: build
        run: mvn -B clean verify
        continue-on-error: true

      - name: Generate XML report from merged exec
        run: |
          if [ -f target/jacoco-merged.exec ]; then
            mvn jacoco:report -Djacoco.dataFile=target/jacoco-merged.exec -Djacoco.reportFormats=XML
          else
            echo "No se encontró target/jacoco-merged.exec"
            exit 1
          fi

      - name: Find JaCoCo XML report
        id: find_report
        run: |
          report_file=$(find . -type f -name "jacoco.xml" | grep "target/site/jacoco" | head -1 || true)
          if [ -z "$report_file" ]; then
            echo "No se encontró el reporte XML generado."
            exit 1
          fi
          echo "report_file=$report_file" >> $GITHUB_OUTPUT

      - name: Extract coverage percentage
        id: coverage
        run: |
          xml="${{ steps.find_report.outputs.report_file }}"
          covered=$(xmllint --xpath "string(sum(//counter[@type='LINE']/@covered))" "$xml" 2>/dev/null | tr -dc '0-9')
          missed=$(xmllint --xpath "string(sum(//counter[@type='LINE']/@missed))" "$xml" 2>/dev/null | tr -dc '0-9')
          if [ -z "$covered" ] || [ -z "$missed" ]; then
            echo "No se pudieron extraer valores de cobertura desde $xml"
            exit 1
          fi
          total=$((covered + missed))
          percent=$(awk "BEGIN {printf \"%.2f\", ($covered / $total) * 100}")
          echo "Cobertura total: $percent%"
          echo "coverage=$percent" >> $GITHUB_OUTPUT

      - name: Comment PR with coverage
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "Coverage Report"
          message: |
            🧪 **Cobertura total:** `${{ steps.coverage.outputs.coverage }}%`
            🔍 *El build fallará automáticamente si la cobertura es menor a 90% (regla de JaCoCo).*

      - name: Fail if JaCoCo check failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Falló el chequeo de cobertura (JaCoCo < 90%)"
          exit 1
