services:
    web:
        image: nginx:latest
        ports:
        - "8080:80"
        volumes:
        - ./html:/usr/share/nginx/html
        networks:
        - webnet

    app:
        image: myapp:latest
        build: ./app
        environment:
        - APP_ENV=dev
        - APP_DEBUG=false
        depends_on:
        - db
        networks:
        - webnet

    db:
        image: postgres:latest
        environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=urlshortener
        volumes:
        - db_data:/var/lib/postgresql/data
        networks:
        - webnet
